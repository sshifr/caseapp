services:
  postgres:
    image: postgres:16-alpine
    container_name: case_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: case_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  backend:
    build: ./backend
    container_name: case_backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/case_app?schema=public
      JWT_SECRET: super-secret-jwt
      ADMIN_LOGIN: admin
      ADMIN_PASSWORD: admin123
    ports:
      - "4000:4000"
    volumes:
      - uploads_data:/app/uploads
    command: sh -c "npx prisma db push && npm run dev"

  frontend:
    build: ./frontend
    container_name: case_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pg_data:
  uploads_data:
